      stock_change: use-existing-klor-ground

  non_connector_changes:
    removed_key:
      logical_key: R34
      pcb_switch: SW22
      diode: D22
      matrix_position: [7, 1]
      rgb_bypass: SW13-DOUT-to-SW14-DIN
      matrix_bridge_forbidden: true
    split:
      gpio: GP1
      path: TX-to-J1-pad4
      mode: half-duplex
      preserve: true
    gp4_isolation:
      trrs_pad: J1.3
      layer: F.Cu
      width_mm: 0.254
      from_xy: [92.700, 127.025]
      to_xy: [90.880, 127.025]
    rgb:
      gpio: GP0
      left_count: 20
      right_count: 19
      total_count: 39

  connector_orientation:
    keyboard_side: F.Cu
    row_axis: global-y
    pin1_end: negative-y
    pin7_end: positive-y
    mating_rule: breakout-pin-N-to-keyboard-pin-8-minus-N
    service_direction: negative-x
    task1_pass_through_center_xy: [143.111, -134.748]
    reference_guide_mm: [2.0, 22.0]
    reference_guide_layer: Cmts.User
    reference_guide_is_fabricated_cut: false

  firmware:
    driver: pmw3360
    spi_driver: SPID0
    sck: GP2
    mosi: GP3
    miso: GP4
    cs: GP9
    motion: NC
    split_pointing: true
    pointing_device_side: right
    handedness: EE_HANDS
    auto_mouse_revision1: false

  task3:
    authorized: true
    prerequisite: task2-complete
    implementation_contract: TASK2F_RESULT.md

  completion_gate:
    task2a_verified: true
    task2b_verified: true
    task2c_verified: true
    task2d_verified: true
    task2e_verified: true
    seven_connector_pins_resolved: true
    connector_net_gpio_firmware_contract_locked: true
    stock_circuit_changes_locked: true
    retained_gpio_ownership_locked: true
    optional_peripheral_dispositions_locked: true
    unresolved_gpio_conflicts_zero: true
    unresolved_net_conflicts_zero: true
    task3_authorized: true

rules:
  - Task 2A through Task 2F do not edit production PCB or production firmware.
  - Task 3 must implement the Task 2A matrix/RGB disposition exactly.
  - Preserve GP1 TX to J1.4 for half-duplex split serial.
  - On the right trackball derivative, J1.3 must be NC and its verified RX branch must be removed before GP4 is used as PMW3360 MISO.
  - GP2 and GP3 may be used by the PMW3360 only when stock I2C/PAW3204 ownership is disabled and legacy I2C jumpers remain open/unpopulated.
  - GP9 may be used as PMW3360 CS only with audio disabled and no active BZ1 load.
  - The KLOR-side PMW connector must use Task 2C keyboard-side order 1=CS, 2=MISO, 3=MOSI, 4=SCK, 5=NC, 6=3V3, 7=GND; do not copy the breakout numbering directly.
  - Preserve Task 2C F.Cu side, row handedness, and opposite-facing N-to-8-minus-N mate unless Task 2C is explicitly reopened.
  - Task 3 must turn the Task 1 breakout datum into real PCB pass-through/edge clearance; the Klorball35 Cmts.User guide is not a fabrication cut by itself.
  - Task 3 must use final SPI net names PMW_CS, PMW_MISO, PMW_MOSI, and PMW_SCK; AUDIO/RX/SCL/SDA are stock-source names only after reassignment.
  - Kivipallur +3V3 maps to the existing KLOR VCC rail on connector pin 6; do not create a separate KLOR 3V3 net.
  - Task 7 must use PMW3360 over SPI0 with GP2 SCK, GP3 MOSI, GP4 MISO, GP9 CS, SPLIT_POINTING_ENABLE, POINTING_DEVICE_RIGHT, and EE_HANDS.
  - The trackball firmware build must not inherit stock default/Vial keymap rules that re-enable OLED, haptic, audio, or music.
  - The trackball firmware must remove PAW3204/I2C ownership from GP2/GP3, audio/PWM ownership from GP9, and full-duplex serial ownership from GP4.
  - Task 2F is complete. Task 3 is authorized to create the right-hand trackball PCB derivative against TASK2F_RESULT.md and this manifest.
  - Task 7 implementation remains governed by Task 2E and the final Task 2F interface freeze.
