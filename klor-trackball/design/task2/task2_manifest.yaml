  task2_complete: true
  unresolved_gpio_conflicts: 0
  unresolved_net_conflicts: 0
  production_files_changed_by_task2: false

  final_interface:
    1:
      breakout_pin: 7
      signal: CS
      pcb_net: PMW_CS
      gpio: GP9
      u1_pad: 12
      firmware: PMW3360-CS
      stock_change: disable-audio-music-pwm4-bz1-inactive
