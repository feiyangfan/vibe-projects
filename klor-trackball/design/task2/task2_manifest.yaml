    retained_gpio_ownership_verified: true
    pmw3360_gpio_ownership_matches_task2d: true
    spi0_contract_locked: true
    right_only_split_pointing_locked: true
    ee_hands_preserved: true
    motion_pin_unused: true
    i2c_and_paw3204_ownership_retired: true
    audio_pwm_ownership_retired: true
    keymap_reenable_conflicts_accounted_for: true
    revision1_gpio_owners_unique: true
