task: 2
name: electrical-and-firmware-interface
status: in-progress

subtasks:
  2a:
    name: removed-key-circuit-audit
    status: complete
    result_document: TASK2A_RESULT.md
  2b:
    name: gpio-and-split-trrs-audit
    status: complete
    result_document: TASK2B_RESULT.md
    audit_script: audit_task2b_gpio_trrs.py
  2c:
    name: kivipallur-connector-lock
    status: complete
    result_document: TASK2C_RESULT.md
    audit_script: audit_task2c_kivipallur_connector.py
  2d:
    name: pcb-net-contract
    status: not-started
  2e:
    name: firmware-ownership
    status: not-started
  2f:
    name: interface-freeze
    status: not-started

sources:
  schematic: ../../klor1.4/PCB/klor1_4/klor1_4.kicad_sch
  pcb: ../../klor1.4/PCB/klor1_4/klor1_4.kicad_pcb
  qmk_config: ../../klor1.4/FIRMWARE/qmk_rp2040/electronlab/klor/config.h
  qmk_keyboard_json: ../../klor1.4/FIRMWARE/qmk_rp2040/electronlab/klor/keyboard.json
  kivipallur_breakout_pcb: ../../klorball35/kicad/Kivipallur_PMW3360_breakout/Kivipallur_PMW3360_breakout.kicad_pcb
  klorball35_right_pcb: ../../klorball35/kicad/klorball35_right/klorball35_right.kicad_pcb
  klorball35_right_schematic: ../../klorball35/kicad/klorball35_right/klorball35_right.kicad_sch
  klorball35_ergogen: ../../klorball35/config.yml
  task1_manifest: ../task1/reference_assembly_manifest.yaml

task2a:
  logical_key:
    name: R34
    is_kicad_component_reference: false
    pcb_reference: SW22

  sw22:
    symbol: KLORlib:SW_PUSH-MX_W_LED
    footprint: KLOR:SK6812MINI_and_cherry_1
    construction:
      schematic_unit_1: mx-switch
      schematic_unit_2: sk6812-rgb
      pcb_pads_1_to_4: sk6812
      pcb_pads_5_to_6: switch
    disposition: remove

  matrix:
    column:
      sw22_pad: 5
      net: col1
    switch_to_diode:
      sw22_pad: 6
      net: Net-(D22-A)
      d22_pad: 2
      d22_pinfunction: A
    row:
      d22_pad: 1
      d22_pinfunction: K
      net: row3
    d22_disposition: remove
    obsolete_net_after_removal: Net-(D22-A)
    bridge_matrix_nets: false
    rule: >-
      Delete SW22, D22, and the local Net-(D22-A) copper. Preserve the col1
      and row3 trunks and do not connect them together.

  rgb:
    integrated_device: SW22-unit-2
    din:
      sw22_pad: 3
      net: Net-(SW13B-DOUT)
      upstream_ref: SW13
      upstream_pad: 1
      upstream_function: DOUT
    dout:
      sw22_pad: 1
      net: Net-(SW14B-DIN)
      downstream_ref: SW14
      downstream_pad: 3
      downstream_function: DIN
    power:
      gnd:
        sw22_pad: 2
        net: GND
      vcc:
        sw22_pad: 4
        net: VCC
    bypass:
      from: SW13-DOUT
      to: SW14-DIN
      required: true
    power_bypass_required: false
    rule: >-
      Remove the SW22 RGB unit with the footprint and connect SW13 DOUT
      directly to SW14 DIN. Delete only SW22-local VCC/GND branches while
      preserving the shared power rails.

  stock_net_ids:
    GND: 1
    VCC: 3
    col1: 17
    row3: 38
    Net-(D22-A): 46
    Net-(SW13B-DOUT): 76
    Net-(SW14B-DIN): 77

  completion_gate:
    sw22_connectivity_resolved: true
    d22_connectivity_resolved: true
    d22_disposition_locked: true
    rgb_device_identified: true
    rgb_upstream_resolved: true
    rgb_downstream_resolved: true
    rgb_bypass_locked: true
    matrix_no_bridge_rule_locked: true
    local_copper_captured: true

task2b:
  controller: elite_pi
  target_gpio_topology:
    GP1:
      u1_socket_pad: 2
      stock_net: TX
      stock_net_id: 31
      stock_peer: J1.4
      revision1_owner: split-half-duplex
      disposition: preserve
    GP2:
      u1_socket_pad: 5
      stock_net: SDA
      stock_net_id: 6
      stock_firmware_claims: [I2C1_SDA, PAW3204_SDIO]
      revision1_owner: PMW3360-SCK
      disposition: disable-stock-functions-and-keep-i2c-jumpers-open
    GP3:
      u1_socket_pad: 6
      stock_net: SCL
      stock_net_id: 7
      stock_firmware_claims: [I2C1_SCL, PAW3204_SCLK]
      direct_stock_peer: J2.3
      revision1_owner: PMW3360-MOSI
      disposition: disable-stock-functions-j2-dnp-and-keep-i2c-jumpers-open
    GP4:
      u1_socket_pad: 7
      stock_net: RX
      stock_net_id: 28
      stock_firmware_claim: optional-full-duplex-serial-TX
      stock_peer: J1.3
      revision1_owner: PMW3360-MISO
      disposition: isolate-j1.3
    GP9:
      u1_socket_pad: 12
      stock_net: AUDIO
      stock_net_id: 2
      stock_peer: BZ1.1
      revision1_owner: PMW3360-CS
      disposition: disable-audio-bz1-dnp

  split_trrs:
    connector: J1
    active_half_duplex:
      gpio: GP1
      net: TX
      connector_pad: 4
      preserve: true
    unused_full_duplex_contact:
      gpio: GP4
      stock_net: RX
      connector_pad: 3
      trackball_state: NC
      exact_isolation_segment:
        layer: F.Cu
        width_mm: 0.254
        from_xy: [92.700, 127.025]
        to_xy: [90.880, 127.025]
      verified_in_source: true

  i2c_optional_paths:
    gp2_net: SDA
    gp3_net: SCL
    connected_jumpers_default_open: true
    relevant_jumpers:
      oled_reversible: [JP3, JP4, JP5, JP6]
      j3_reversible: [JP16, JP17, JP20, JP21]
      haptic_sda: [JP27, JP28]
    haptic:
      ref: J2
      scl_direct_pad: 3
      revision1_population: DNP
    revision1_rules:
      - disable-I2C-on-GP2-GP3
      - disable-stock-PAW3204
      - keep-legacy-I2C-jumpers-open
      - do-not-populate-right-OLED-or-haptic

  audio:
    gpio: GP9
    stock_net: AUDIO
    buzzer_ref: BZ1
    buzzer_pad: 1
    revision1_rules:
      - disable-QMK-audio
      - BZ1-DNP
      - no-active-audio-load-on-GP9

  completion_gate:
    stock_gpio_ownership_resolved: true
    gp1_half_duplex_path_preserved: true
    gp2_i2c_paw_conflicts_disposed: true
    gp3_i2c_paw_haptic_conflicts_disposed: true
    gp4_trrs_peer_resolved: true
    gp4_exact_isolation_segment_verified: true
    gp9_audio_peer_resolved: true
    gp9_audio_disposition_locked: true
    revision1_gpio_owners_unique: true

task2c:
  connector_family:
    footprint: Connector_PinHeader_2.54mm:PinHeader_1x07_P2.54mm_Vertical
    topology: 1x7-through-hole
    pitch_mm: 2.54

  breakout:
    ref: J1
    footprint_side: B.Cu
    sensor_ref: U2
    sensor_side: B.Cu
    outline_mm: [22.0, 25.0]
    pinout:
      1: GND
      2: 3V3
      3: MOTION
      4: SCK
      5: MOSI
      6: MISO
      7: CS

  working_keyboard_reference:
    project: klorball35_right
    ref: J2
    footprint_side: F.Cu
    pinout:
      1: CS
      2: MISO
      3: MOSI
      4: SCK
      5: NC
      6: 3V3
      7: GND
    motion_pin_intentionally_nc: true
    reference_guide:
      size_mm: [2.0, 22.0]
      layer: Cmts.User
      fabricated_edge_cut: false
      header_parallel_to_long_axis: true
      header_midpoint_offset_from_guide_mm: 4.613622

  mating:
    opposite_facing: true
    rule: breakout-pin-N-to-keyboard-pin-8-minus-N
    breakout_to_keyboard_pin_pairs:
      - [1, 7]
      - [2, 6]
      - [3, 5]
      - [4, 4]
      - [5, 3]
      - [6, 2]
      - [7, 1]
    motion_revision1: NC

  klor_target_orientation:
    canonical_frame: klor-gerber-excellon
    task1_slot_center_xy: [143.111, -134.748]
    slot_long_axis: global-y
    sensor_service_direction: negative-x
    keyboard_connector_side: F.Cu
    connector_row_axis: global-y
    connector_side_of_guide: positive-x-non-sensor-side
    pin1_end: negative-y
    pin7_end: positive-y
    physical_order_negative_y_to_positive_y:
      - {pin: 1, signal: CS}
      - {pin: 2, signal: MISO}
      - {pin: 3, signal: MOSI}
      - {pin: 4, signal: SCK}
      - {pin: 5, signal: NC}
      - {pin: 6, signal: 3V3}
      - {pin: 7, signal: GND}
    reference_header_to_guide_offset_mm: 4.613622
    task3_position_rule: >-
      Start from the working-reference header/guide relationship and verify the
      final production XY against the locked Task 1 assembly. Do not flip side,
      row handedness, pin numbering, or the N-to-8-minus-N mating rule.

  task3_pass_through_rule: >-
    The Klorball35 2x22 rectangle is a Cmts.User mechanical guide, not a
    fabricated Edge.Cuts slot. Task 3 must create the actual KLOR PCB
    pass-through or edge clearance at the Task 1-locked breakout datum.

  completion_gate:
    breakout_footprint_and_pitch_resolved: true
    breakout_pin_order_resolved: true
    keyboard_side_pin_order_resolved: true
    board_sides_resolved: true
    opposite_facing_mating_verified: true
    motion_nc_verified: true
    breakout_outline_verified: true
    reference_guide_geometry_verified: true
    reference_guide_layer_distinguished_from_edge_cuts: true
    klor_target_axis_and_handedness_locked: true
    mating_direction_unambiguous: true

rules:
  - Task 2A through Task 2C do not edit production PCB geometry.
  - Task 3 must implement the Task 2A matrix/RGB disposition exactly.
  - Preserve GP1 TX to J1.4 for half-duplex split serial.
  - On the right trackball derivative, J1.3 must be NC and its verified RX branch must be removed before GP4 is used as PMW3360 MISO.
  - GP2 and GP3 may be used by the PMW3360 only when stock I2C/PAW3204 ownership is disabled and legacy I2C jumpers remain open/unpopulated.
  - GP9 may be used as PMW3360 CS only with audio disabled and no active BZ1 load.
  - The KLOR-side PMW connector must use Task 2C keyboard-side order 1=CS, 2=MISO, 3=MOSI, 4=SCK, 5=NC, 6=3V3, 7=GND; do not copy the breakout numbering directly.
  - Preserve Task 2C F.Cu side, row handedness, and opposite-facing N-to-8-minus-N mate unless Task 2C is explicitly reopened.
  - Task 3 must turn the Task 1 breakout datum into real PCB pass-through/edge clearance; the Klorball35 Cmts.User guide is not a fabrication cut by itself.
  - Task 3 remains blocked until Task 2D through Task 2F are complete.
