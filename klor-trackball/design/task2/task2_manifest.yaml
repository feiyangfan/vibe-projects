    keyboard_side_order:
      1: CS
      2: MISO
      3: MOSI
      4: SCK
      5: NC
      6: 3V3
      7: GND
    target_nets:
      1: PMW_CS
      2: PMW_MISO
      3: PMW_MOSI
      4: PMW_SCK
      5: NC
      6: VCC
      7: GND

  signal_routes:
    CS:
      connector_pin: 1
      target_net: PMW_CS
      gpio: GP9
      u1_pad: 12
      stock_net: AUDIO
      stock_net_id: 2
      disposition: disable-audio-bz1-dnp-no-active-load
    MISO:
      connector_pin: 2
      target_net: PMW_MISO
      gpio: GP4
      u1_pad: 7
      stock_net: RX
      stock_net_id: 28
      disposition: isolate-j1-pad3-using-task2b-verified-branch
    MOSI:
      connector_pin: 3
      target_net: PMW_MOSI
      gpio: GP3
      u1_pad: 6
      stock_net: SCL
      stock_net_id: 7
      disposition: disable-i2c-paw3204-j2-dnp-jumpers-open
    SCK:
      connector_pin: 4
      target_net: PMW_SCK
      gpio: GP2
      u1_pad: 5
      stock_net: SDA
      stock_net_id: 6
      disposition: disable-i2c-paw3204-jumpers-open

  motion:
    connector_pin: 5
    breakout_signal: MOTION
    target_net: NC
    gpio: null
    rule: connector-pad-unrouted-and-unassigned-for-revision1

  power:
    breakout_signal: 3V3
    connector_pin: 6
    target_klor_net: VCC
    u1_pad: 21
