    3:
      breakout_pin: 5
      signal: MOSI
      pcb_net: PMW_MOSI
      gpio: GP3
      u1_pad: 6
      firmware: SPI0-MOSI-PMW3360-MOSI
      stock_change: disable-i2c1-paw3204-j2-dnp-jumpers-open
    4:
      breakout_pin: 4
      signal: SCK
      pcb_net: PMW_SCK
      gpio: GP2
      u1_pad: 5
      firmware: SPI0-SCK-PMW3360-SCK
      stock_change: disable-i2c1-paw3204-jumpers-open
    5:
      breakout_pin: 3
      signal: MOTION
      pcb_net: NC
      gpio: null
      firmware: unused-polled
      stock_change: connector-pad-unrouted-no-motion-pin
    6:
      breakout_pin: 2
