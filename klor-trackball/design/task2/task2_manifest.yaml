    task2c_dependency_verified: true
    all_connector_pins_accounted_for: true
    spi_gpio_routes_locked: true
    motion_nc_locked: true
    vcc_mapping_locked: true
    ground_mapping_locked: true
    final_spi_net_names_locked: true
    unresolved_connector_net_ownership: false


