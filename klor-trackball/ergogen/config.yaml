  stock_konrad_switch_cutouts:
    - what: rectangle
      where: /^(sw(?:[1-9]|1[0-7]|20|21|22))$/
      size: [mx_cutout, mx_cutout]

  stock_pcb_holes:
    - what: circle
      where: /^mh[1-9]$/
      radius: pcb_m3_hole / 2

  # Right-target mounting-hole set. All stock holes are retained except MH8,
  # whose target instance moves +1.0 mm Y to clear the connector-right service notch.
  trackball_pcb_holes:
    - what: circle
      where: /^(mh[1-7]|mh9)$/
      radius: pcb_m3_hole / 2
    - what: circle
      where: mh8_trackball
      radius: pcb_m3_hole / 2

  stock_case_mount_axes:
    - what: circle
      where: /^case_mount_/
      radius: case_m2_hole / 2

  trackball_ball:
    - what: circle
      where: ball_center
      radius: ball_diameter / 2

  trackball_housing_envelope:
    - what: rectangle
      where: housing_center
      size: [housing_w, housing_h]

  trackball_housing_mount_axes:
    - what: circle
      where: /^housing_screw_[12]$/
      radius: housing_axis_marker / 2

  breakout_service_slot:
    - what: rectangle
      where: breakout_center
      size: [breakout_slot_w, breakout_slot_h]

  pmw_header_envelope:
    - what: rectangle
      where: pmw_header_center
      size: [pmw_header_body_w, pmw_header_body_h]

  # The locked 1x7 mating row overhangs the stock lower edge. This small local
  # rectangle is the declarative equivalent of the old Task-3D support tongue.
  pmw_support_tongue:
    - what: rectangle
      where: pmw_support_tongue_center
      size: [pmw_support_tongue_w, pmw_support_tongue_h]

  trackball_board:
    - name: stock_board
    - name: pmw_support_tongue
      operation: add
    - name: breakout_service_slot
      operation: subtract

  trackball_konrad_switch_cutouts:
    - what: rectangle
      where: /^(sw(?:[1-9]|1[0-7]|20|21))$/
      size: [mx_cutout, mx_cutout]

  # R34 is not retained electrically, but its existing 14x14 plate aperture is
  # useful material already removed. Merge that opening with the 2x22 service
  # corridor rather than creating a larger unrelated plate change.
  trackball_plate_service_opening:
    - what: rectangle
      where: sw22
      size: [mx_cutout, mx_cutout]
    - name: breakout_service_slot
      operation: add

  task2c_preview:
    - name: trackball_board
    - name: trackball_konrad_switch_cutouts
      operation: stack
    - name: trackball_plate_service_opening
      operation: stack
    - name: trackball_ball
      operation: stack
    - name: trackball_housing_envelope
      operation: stack
    - name: trackball_housing_mount_axes
      operation: stack
    - name: pmw_header_envelope
      operation: stack
    - name: trackball_pcb_holes
      operation: stack
    - name: stock_case_mount_axes
      operation: stack

  task2b_preview:
    - name: stock_board
    - name: stock_konrad_switch_cutouts
      operation: stack
    - name: stock_pcb_holes
      operation: stack
    - name: stock_case_mount_axes
      operation: stack

  task3b_fixture_outline:
    - what: rectangle
      where: fp_fixture_center
      size: [275, 45]

pcbs:
  task3b_footprint_fixture:
    template: kicad8
    outlines:
      main:
        outline: task3b_fixture_outline
        layer: Edge.Cuts
    footprints:
      key_b:
        what: klor_key
