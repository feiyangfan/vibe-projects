migration_instruction:
  - Re-derive KLOR/Konrad points and outlines from stock source geometry.
  - Use the previous values above as numerical regression references only.
  - Do not reproduce UUID-based KiCad mutation as the new architecture.
  - Prefer parameter changes followed by regeneration and validation.
