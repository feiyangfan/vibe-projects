task3_change_boundary:
  allowed:
    - choose_production_RP2040_ProMicro_compatible_controller_within_frozen_envelope
    - define_switch_diode_rgb_controller_trrs_encoder_and_pmw_footprints
    - assign_matrix_and_signal_nets
    - choose_final_GPIO_ownership_consistent_with_requirements
    - generate_left_and_right_unrouted_electrical_PCBS
    - add_copper_keepouts_required_by_frozen_mechanics
  forbidden_without_reopening_task2:
    - move_any_retained_key_center_or_rotation
    - restore_R34_or_remove_R32_or_R33
    - move_or_remove_right_encoder
    - move_MCU_or_TRRS_geometry
    - move_any_structural_axis
    - move_ball_housing_or_breakout
    - change_housing_handedness
    - change_actual_housing_derived_trackball_cavity
    - move_keyboard_side_PMW_cable_header
    - change_stock_board_geometry_outside_the_frozen_local_delta
    - change_stock_switchplate_outer_perimeter
    - change_pmw_header_side_row_axis_rotation_or_physical_pin_order

deferred_beyond_task2:
  - production_housing_mount_hole_diameter
  - exact_right_case_boolean_clearance_margin
  - exact_controller_variant
  - final_GPIO_allocation
  - electrical_routing
  - copper_zone_geometry
  - fabrication_tolerances_not_already_required_by_mechanical_fit

change_control:
  revision_5_reason: >-
    Revision 4 qualified the source right STL even though that physical housing
    puts the connector inward/left and the ball opening outward/right on the
    right keyboard half. Revision 5 uses the mirrored source left STL, placing
    the opening toward the thumb cluster (-X) and connector outward (+X).
    A real-mesh search moves the ball 6.0 mm outward to (21.5, -31.000147),
    mirrors the housing and M2 screw datums, derives a new cavity, and moves the
    same 1x7 board header to (18.5, -14.5) rotated 90 degrees. All 19 retained
    keys and all nine PCB holes remain.
  revision_4_reason: >-
    Task 2E placed the real Type-C housing, 25 mm sphere, generated Rev-3 PCB,
    stock switchplate and stock right case into one 3D frame. Rev 3 showed
    158.111 mm3 of actual housing/PCB intersection at a plausible ball height;
    pure Z separation only cleared at an unusable ~24 mm exposed ball cap.
    Revision 4 therefore moves the ball only (-1,-3) mm, replaces the cavity
    with the measured real-housing/ball keepout, removes the rigid PMW
    peninsula, and relocates the keyboard-side 1x7 to reclaimed SW22 PCB area
    via a short cable. The Kivipallur connector itself remains on the +X/right
    side of the ball and the electrical pin contract is unchanged.
  revision_3_reason: >-
    Revision 2 left stock FR-4 under and around most of the trackball because
    the 2 x 22 breakout corridor was incorrectly treated as the complete PCB
    clearance feature. Revision 3 adds a KLORBall-35-style open-edge cavity,
    adapted locally to preserve retained R33/SW21 and the right-side PMW
    connector peninsula. The ball/header placement and electrical ownership do
    not change.
  revision_2_reason: >-
    User-requested correction to match KLORBall-35 trackball handedness: rotate
    the Type-C/Kivipallur assembly 180 degrees so the keyboard connector is on
    the right / positive-X side. The ball center moves 5.761644 mm inward in X,
    to x=16.5 mm, because the direct flip at the historical center overlaps
    retained SW16 under the existing conservative housing-envelope check. This
    inward shift also preserves stock MH8, so all nine PCB mounting holes remain
    at their stock positions.
  rule: >-
    Any edit to a frozen product-geometry or mechanical-interface item above must
    update this manifest, REQUIREMENTS.md when product behavior changes, and the
    Task-2 validators/results. Task 3 may not silently reinterpret Task-2 geometry.
