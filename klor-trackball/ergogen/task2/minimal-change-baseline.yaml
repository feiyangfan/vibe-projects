    - removing_encoder_alone_is_dominated_while_R33_is_retained
    - removing_R33_is_a_meaningful_ergonomic_option_but_not_minimal_change

switchplate_baseline_native:
  R34_center: [62.3864, 25.2441]
  assumed_mx_opening: [14.0, 14.0]
  breakout_center: [62.4732, 19.2661]
  breakout_envelope: [2.0, 22.0]
  breakout_length_already_inside_R34_opening_approx: 12.0
  additional_narrow_extension_approx: 10.0
  housing_screws:
    - [75.4722, 27.2478]
    - [75.4743, 11.2878]
  screw_spacing_nominal: 16.0

right_case_baseline_native:
  placed_housing_xy_bbox_approx:
    min: [134.30, 60.22]
    max: [171.90, 90.20]
  modification: local_shell_relief_only
  preserve_structural_axes: true

pcb_change_contract:
  preserve:
    - all_retained_key_centers_and_rotations
    - R32
    - R33
    - right_encoder
    - controller_location
    - trrs_location
    - structural_holes
    - stock_outline_except_breakout_notch
  change:
    - omit_R34_SW22_D22_and_rgb
    - bypass_rgb_logically_in_generated_net_model
    - add_2x22_open_edge_breakout_notch
    - add_1x7_pmw_header
    - add_pmw_spi_power_ground_nets
  avoid_unless_proven_necessary:
    - connector_support_tongue
    - unrelated_edge_cut_changes
    - uuid_based_stock_copper_mutation
    - historical_routing_topology

switchplate_change_contract:
  preserve:
    - stock_perimeter
    - stock_thickness_reference
    - all_eight_structural_axes
    - all_retained_switch_openings
  change:
    - reuse_or_merge_R34_opening_for_breakout_service_path
    - extend_local_2mm_service_clearance_as_needed
    - add_two_trackball_housing_mount_axes

case_change_contract:
  left_case: unchanged
  right_case:
    preserve:
      - stock_structure_outside_trackball_region
      - all_eight_structural_axes
      - pcb_plate_stackup
    change:
      - deterministic_local_shell_relief_from_placed_housing_clearance_volume
    preferred_method: parameterized_boolean_on_stock_stl
    fallback: parametric_case_reauthor_only_if_boolean_workflow_is_insufficient
