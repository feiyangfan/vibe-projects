  right_case: ../../klor1.4/case/3DP/konrad/regular/KLOR_konrad_case_R.stl
  housing: ../../Keyball 25mm Trackball Case Type C - 6719828/files/keyball_trackball_case_25mm_type_c.stp
  breakout: ../../klorball35/kicad/Kivipallur_PMW3360_breakout/Kivipallur_PMW3360_breakout.kicad_pcb

