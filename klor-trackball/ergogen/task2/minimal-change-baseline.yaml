status: task2a_minimal_change_baseline
units: mm

objective:
  primary: minimize_changes_to_stock_klor_geometry
  secondary:
    - preserve_trackball_usability
    - keep_design_regenerable
    - avoid_unnecessary_case_and_pcb_reconstruction

selected_baseline:
  name: r34_only_encoder_retained
  right_thumb:
    retain:
      - {logical: R32, switch: SW20, diode: D20}
      - {logical: R33, switch: SW21, diode: D21}
    remove:
      - {logical: R34, switch: SW22, diode: D22}
  right_encoder:
    reference: SW18
    action: retain
    reason: historical housing clearance ~27.772 mm; removal does not improve placement while R33 is retained

