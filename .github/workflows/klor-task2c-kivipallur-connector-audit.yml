name: KLOR Task 2C Kivipallur connector audit

on:
  pull_request:
    paths:
      - 'klor-trackball/design/task2/**'
      - 'klor-trackball/klorball35/config.yml'
      - 'klor-trackball/klorball35/kicad/Kivipallur_PMW3360_breakout/**'
      - 'klor-trackball/klorball35/kicad/klorball35_right/**'
      - '.github/workflows/klor-task2c-kivipallur-connector-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit Kivipallur connector contract
        working-directory: klor-trackball
        run: |
          set +e
          python3 design/task2/audit_task2c_kivipallur_connector.py \
            --json-output design/task2/generated/task2c-kivipallur-connector-audit.json
          status=$?
          echo "audit_status=$status" >> "$GITHUB_ENV"
          exit 0
      - name: Upload Task 2C evidence
        uses: actions/upload-artifact@v4
        with:
          name: klor-task2c-kivipallur-connector-audit
          path: klor-trackball/design/task2/generated/task2c-kivipallur-connector-audit.json
      - name: Enforce Task 2C audit result
        run: exit "$audit_status"
