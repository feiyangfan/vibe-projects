name: KLOR Task 3F KiCad diagnostic

on:
  push:
    branches:
      - klor-trackball/task-3f-preservation-drc
    paths:
      - "klor-trackball/PCB/konrad_trackball/**"
      - ".github/workflows/klor-task3f-kicad-diagnostic.yml"

jobs:
  drc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install KiCad 10 stable
        shell: bash
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends kicad
          kicad-cli version

      - name: Run stock baseline DRC
        id: stock_drc
        shell: bash
        run: |
          set +e
          mkdir -p klor-trackball/design/task3/generated
          kicad-cli pcb drc \
            --refill-zones \
            --schematic-parity \
            --all-track-errors \
            --severity-all \
            --format json \
            --output klor-trackball/design/task3/generated/task3f-stock-kicad-drc.json \
            klor-trackball/klor1.4/PCB/klor1_4/klor1_4.kicad_pcb
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "stock kicad-cli exit code: $code"
          exit 0

      - name: Run integrated PCB DRC
        id: drc
        shell: bash
        run: |
          set +e
          mkdir -p klor-trackball/design/task3/generated
          kicad-cli pcb drc             --refill-zones             --schematic-parity             --all-track-errors             --severity-all             --format json             --output klor-trackball/design/task3/generated/task3f-kicad-drc.json             klor-trackball/PCB/konrad_trackball/konrad_trackball.kicad_pcb
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "kicad-cli exit code: $code"
          exit 0

      - name: Summarize DRC reports
        shell: python
        run: |
          import json
          from collections import Counter
          from pathlib import Path
          for label, path in [
              ("stock", Path("klor-trackball/design/task3/generated/task3f-stock-kicad-drc.json")),
              ("derivative", Path("klor-trackball/design/task3/generated/task3f-kicad-drc.json")),
          ]:
              data=json.loads(path.read_text())
              print(f"=== {label} ===")
              for key in ("schematic_parity","unconnected_items","violations"):
                  rows=data.get(key,[])
                  print(key, len(rows), Counter(x.get("severity") for x in rows), Counter(x.get("type") for x in rows))

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: klor-task3f-kicad-diagnostic
          path: klor-trackball/design/task3/generated/
          if-no-files-found: error

      - name: Record diagnostic exit code
        run: |
          echo "Stock DRC diagnostic exit code = ${{ steps.stock_drc.outputs.exit_code }}"
          echo "Derivative DRC diagnostic exit code = ${{ steps.drc.outputs.exit_code }}"
