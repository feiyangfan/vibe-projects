name: KLOR Task 3A derivative project audit

on:
  push:
    paths:
      - "klor-trackball/PCB/konrad_trackball/**"
      - "klor-trackball/design/task3/**"
      - "klor-trackball/klor1.4/PCB/klor1_4/**"
      - ".github/workflows/klor-task3a-derivative-project-audit.yml"
  pull_request:
    paths:
      - "klor-trackball/PCB/konrad_trackball/**"
      - "klor-trackball/design/task3/**"
      - "klor-trackball/klor1.4/PCB/klor1_4/**"
      - ".github/workflows/klor-task3a-derivative-project-audit.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Audit Task 3A derivative baseline
        id: audit
        shell: bash
        run: |
          set +e
          python3 klor-trackball/design/task3/audit_task3a_derivative_project.py \
            --json-output klor-trackball/design/task3/generated/task3a-derivative-project-audit.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Task 3A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: klor-task3a-derivative-project-audit
          path: klor-trackball/design/task3/generated/
          if-no-files-found: error

      - name: Enforce Task 3A gate
        run: test "${{ steps.audit.outputs.exit_code }}" = "0"
