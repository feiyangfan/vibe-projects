name: KLOR Task 3C PCB synchronization audit

on:
  push:
    paths:
      - "klor-trackball/PCB/konrad_trackball/**"
      - "klor-trackball/design/task2/TASK2F_RESULT.md"
      - "klor-trackball/design/task3/**"
      - "klor-trackball/klor1.4/PCB/klor1_4/**"
      - ".github/workflows/klor-task3c-pcb-sync-audit.yml"
  pull_request:
    paths:
      - "klor-trackball/PCB/konrad_trackball/**"
      - "klor-trackball/design/task2/TASK2F_RESULT.md"
      - "klor-trackball/design/task3/**"
      - "klor-trackball/klor1.4/PCB/klor1_4/**"
      - ".github/workflows/klor-task3c-pcb-sync-audit.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Audit Task 3C PCB synchronization
        id: audit
        shell: bash
        run: |
          set +e
          mkdir -p klor-trackball/design/task3/generated
          python3 klor-trackball/design/task3/audit_task3c_pcb_sync.py \
            --json-output klor-trackball/design/task3/generated/task3c-pcb-sync-audit.json \
            > klor-trackball/design/task3/generated/task3c-pcb-sync-audit.log 2>&1
          code=$?
          cat klor-trackball/design/task3/generated/task3c-pcb-sync-audit.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Task 3C evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: klor-task3c-pcb-sync-audit
          path: klor-trackball/design/task3/generated/
          if-no-files-found: error

      - name: Enforce Task 3C gate
        run: test "${{ steps.audit.outputs.exit_code }}" = "0"
