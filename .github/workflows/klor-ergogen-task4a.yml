name: KLOR Task 4A - routing rules

on:
  pull_request:
    paths:
      - "klor-trackball/REQUIREMENTS.md"
      - "klor-trackball/README.md"
      - "klor-trackball/ergogen/task3/**"
      - "klor-trackball/ergogen/task4/**"
      - "klor-trackball/ergogen/scripts/validate_task4a.py"
      - "klor-trackball/klor1.4/PCB/klor1_4/klor1_4.kicad_pro"
      - "klor-trackball/klor1.4/PCB/klor1_4/klor1_4.kicad_dru"
      - "klor-trackball/klor1.4/PCB/klor1_4/klor1_4.kicad_pcb"
      - ".github/workflows/klor-ergogen-task4a.yml"

permissions:
  contents: read

jobs:
  routing-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: klor-trackball/ergogen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install "PyYAML==6.0.2"

      - name: Generate pass A
        run: npx --yes ergogen@4.2.1 . --output generated-a --clean --svg --debug

      - name: Generate pass B
        run: npx --yes ergogen@4.2.1 . --output generated-b --clean --svg --debug

      - name: Prove Task-3 pair still regenerates deterministically
        run: diff -rq generated-a generated-b

      - name: Re-run Task 3E pair freeze
        run: python scripts/validate_task3e.py generated-a

      - name: Validate Task 4A routing contract
        run: python scripts/validate_task4a.py generated-a
