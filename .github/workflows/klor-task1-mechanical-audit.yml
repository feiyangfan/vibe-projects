name: KLOR Task 1 mechanical audit

on:
  pull_request:
    paths:
      - 'klor-trackball/design/task1/**'
      - 'klor-trackball/Keyball 25mm Trackball Case Type C - 6719828/**'
      - 'klor-trackball/klor1.4/PCB/klor1_4/**'
      - 'klor-trackball/klor1.4/case/3DP/konrad/**'
      - 'klor-trackball/klorball35/kicad/Kivipallur_PMW3360_breakout/**'
      - '.github/workflows/klor-task1-mechanical-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geometry dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy trimesh rtree networkx shapely python-fcl
      - name: Run preflight
        working-directory: klor-trackball
        run: python design/task1/preflight_reference_assembly.py --json-output design/task1/generated/preflight.json
      - name: Inspect native case and switchplate frames
        working-directory: klor-trackball
        run: python design/task1/case_alignment_diagnostics.py | tee design/task1/generated/case-alignment-diagnostics.json
      - name: Inspect mounting pattern
        working-directory: klor-trackball
        run: python design/task1/mount_pattern_diagnostics.py | tee design/task1/generated/mount-pattern-diagnostics.json
      - name: Check structural fastener envelopes
        working-directory: klor-trackball
        run: python design/task1/structural_mount_collision_diagnostic.py | tee design/task1/generated/structural-mount-collision.json
      - name: Run final native-frame mechanical audit
        working-directory: klor-trackball
        shell: bash
        run: |
          set -o pipefail
          python design/task1/mechanical_reference_audit_v3.py | tee design/task1/generated/mechanical-audit-final.json
      - name: Upload Task 1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: klor-task1-mechanical-evidence
          path: klor-trackball/design/task1/generated/*.json
