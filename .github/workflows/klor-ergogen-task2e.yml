name: KLOR Task 2E - full 3D trackball fit

on:
  pull_request:
    paths:
      - "klor-trackball/REQUIREMENTS.md"
      - "klor-trackball/ergogen/**"
      - "klor-trackball/Keyball 25mm Trackball Case Type C - 6719828/files/keyball_trackball_case_25mm_type_c_right.stl"
      - "klor-trackball/klor1.4/case/3DP/konrad/switchplate/KLOR_konrad_3DP_switchplate.stl"
      - "klor-trackball/klor1.4/case/3DP/konrad/regular/KLOR_konrad_case_R.stl"
      - ".github/workflows/klor-ergogen-task2e.yml"

permissions:
  contents: read

jobs:
  validate-full-3d-fit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: klor-trackball/ergogen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install 3D validator dependencies
        run: >-
          python -m pip install
          "PyYAML==6.0.2"
          "numpy>=2,<3"
          "trimesh>=4.4,<5"
          "shapely>=2,<3"
          "ezdxf>=1.3,<2"
          "triangle>=20230923"
          "manifold3d>=2.5,<4"

      - name: Generate Ergogen geometry
        run: npx --yes ergogen@4.2.1 . --output generated --clean --svg --debug

      - name: Re-run Task 2B preserved-stock gate
        run: python scripts/validate_task2b.py --generated generated

      - name: Re-run Task 2C trackball-delta gate
        run: python scripts/validate_task2c.py --generated generated

      - name: Re-run Task 2D geometry-freeze gate
        run: python scripts/validate_task2d.py --generated generated

      - name: Generate and validate Task 2E full 3D assembly
        run: python scripts/validate_task2e.py --generated generated --output task2e-output

      - name: Upload Task-2E 3D assembly
        uses: actions/upload-artifact@v4
        with:
          name: klor-task2e-full-3d-trackball-fit
          path: |
            klor-trackball/ergogen/task2e-output/
          if-no-files-found: error
