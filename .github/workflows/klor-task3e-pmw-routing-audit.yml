name: KLOR Task 3E PMW routing audit

on:
  push:
    paths:
      - "klor-trackball/PCB/konrad_trackball/**"
      - "klor-trackball/design/task2/**"
      - "klor-trackball/design/task3/**"
      - "klor-trackball/design/konrad_trackball_geometry.yaml"
      - ".github/workflows/klor-task3e-pmw-routing-audit.yml"
  pull_request:
    paths:
      - "klor-trackball/PCB/konrad_trackball/**"
      - "klor-trackball/design/task2/**"
      - "klor-trackball/design/task3/**"
      - "klor-trackball/design/konrad_trackball_geometry.yaml"
      - ".github/workflows/klor-task3e-pmw-routing-audit.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Reproduce Task 3E PCB
        id: reproduce
        shell: bash
        run: |
          set +e
          mkdir -p klor-trackball/design/task3/generated
          cp klor-trackball/PCB/konrad_trackball/konrad_trackball.kicad_pcb /tmp/task3e-committed.kicad_pcb
          git checkout 57eca64b31ed46b43c3112a20a4270e6bc127206 -- klor-trackball/PCB/konrad_trackball/konrad_trackball.kicad_pcb
          python3 klor-trackball/design/task3/apply_task3e_pmw_routing.py > klor-trackball/design/task3/generated/task3e-reproduction.log 2>&1
          code=$?
          cat klor-trackball/design/task3/generated/task3e-reproduction.log
          if [ "$code" = "0" ]; then cmp -s /tmp/task3e-committed.kicad_pcb klor-trackball/PCB/konrad_trackball/konrad_trackball.kicad_pcb; code=$?; fi
          cp /tmp/task3e-committed.kicad_pcb klor-trackball/PCB/konrad_trackball/konrad_trackball.kicad_pcb
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Audit Task 3E routing
        id: audit
        shell: bash
        run: |
          set +e
          python3 klor-trackball/design/task3/audit_task3e_pmw_routing.py --json-output klor-trackball/design/task3/generated/task3e-pmw-routing-audit.json > klor-trackball/design/task3/generated/task3e-pmw-routing-audit.log 2>&1
          code=$?
          cat klor-trackball/design/task3/generated/task3e-pmw-routing-audit.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Task 3E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: klor-task3e-pmw-routing-audit
          path: klor-trackball/design/task3/generated/
          if-no-files-found: error
      - name: Enforce Task 3E gate
        run: |
          test "${{ steps.reproduce.outputs.exit_code }}" = "0"
          test "${{ steps.audit.outputs.exit_code }}" = "0"
