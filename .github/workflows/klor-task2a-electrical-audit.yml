name: KLOR Task 2A electrical audit

on:
  pull_request:
    paths:
      - 'klor-trackball/README.md'
      - 'klor-trackball/design/task2/**'
      - 'klor-trackball/klor1.4/PCB/klor1_4/klor1_4.kicad_pcb'
      - 'klor-trackball/klor1.4/PCB/klor1_4/klor1_4.kicad_sch'
      - '.github/workflows/klor-task2a-electrical-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit SW22 D22 and RGB topology
        working-directory: klor-trackball
        run: |
          python3 design/task2/audit_task2a_removed_key.py \
            --json-output design/task2/generated/task2a-removed-key-audit.json
      - name: Upload Task 2A evidence
        uses: actions/upload-artifact@v4
        with:
          name: klor-task2a-electrical-audit
          path: klor-trackball/design/task2/generated/task2a-removed-key-audit.json
