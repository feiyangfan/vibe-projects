name: KLOR Task 3D connector/pass-through audit

on:
  push:
    paths:
      - "klor-trackball/PCB/konrad_trackball/**"
      - "klor-trackball/design/task1/**"
      - "klor-trackball/design/task2/**"
      - "klor-trackball/design/task3/**"
      - "klor-trackball/design/konrad_trackball_geometry.yaml"
      - ".github/workflows/klor-task3d-connector-pass-through-audit.yml"
  pull_request:
    paths:
      - "klor-trackball/PCB/konrad_trackball/**"
      - "klor-trackball/design/task1/**"
      - "klor-trackball/design/task2/**"
      - "klor-trackball/design/task3/**"
      - "klor-trackball/design/konrad_trackball_geometry.yaml"
      - ".github/workflows/klor-task3d-connector-pass-through-audit.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Audit Task 3D connector and pass-through
        id: audit
        shell: bash
        run: |
          set +e
          mkdir -p klor-trackball/design/task3/generated
          python3 klor-trackball/design/task3/audit_task3d_connector_pass_through.py \
            --json-output klor-trackball/design/task3/generated/task3d-connector-pass-through-audit.json \
            > klor-trackball/design/task3/generated/task3d-connector-pass-through-audit.log 2>&1
          code=$?
          cat klor-trackball/design/task3/generated/task3d-connector-pass-through-audit.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Task 3D evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: klor-task3d-connector-pass-through-audit
          path: klor-trackball/design/task3/generated/
          if-no-files-found: error

      - name: Enforce Task 3D gate
        run: test "${{ steps.audit.outputs.exit_code }}" = "0"
