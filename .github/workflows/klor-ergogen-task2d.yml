name: KLOR Task 2D - geometry freeze

on:
  pull_request:
    paths:
      - "klor-trackball/REQUIREMENTS.md"
      - "klor-trackball/ergogen/**"
      - ".github/workflows/klor-ergogen-task2d.yml"

permissions:
  contents: read

jobs:
  freeze-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: klor-trackball/ergogen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install "PyYAML==6.0.2"

      - name: Generate pass A
        run: npx --yes ergogen@4.2.1 . --output generated-a --clean --svg --debug

      - name: Generate pass B
        run: npx --yes ergogen@4.2.1 . --output generated-b --clean --svg --debug

      - name: Prove deterministic regeneration
        run: diff -rq generated-a generated-b

      - name: Re-run Task 2B preserved-stock gate
        run: python scripts/validate_task2b.py --generated generated-a

      - name: Re-run Task 2C trackball-delta gate
        run: python scripts/validate_task2c.py --generated generated-a

      - name: Validate Task 2D freeze contract
        run: python scripts/validate_task2d.py --generated generated-a

      - name: Upload frozen Task-2 geometry
        uses: actions/upload-artifact@v4
        with:
          name: klor-task2d-frozen-geometry
          path: klor-trackball/ergogen/generated-a/
          if-no-files-found: error
