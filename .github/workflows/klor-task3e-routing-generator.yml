name: KLOR Task 3E routing generator

on:
  push:
    branches:
      - "klor-trackball/task-3e-pmw-routing"
    paths:
      - "klor-trackball/design/task3/apply_task3e_pmw_routing.py"
      - ".github/workflows/klor-task3e-routing-generator.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: klor-trackball/task-3e-pmw-routing
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate Task 3E routes
        id: generate
        shell: bash
        run: |
          set +e
          mkdir -p klor-trackball/design/task3/generated
          python3 klor-trackball/design/task3/apply_task3e_pmw_routing.py \
            > klor-trackball/design/task3/generated/task3e-routing-generator.log 2>&1
          code=$?
          cat klor-trackball/design/task3/generated/task3e-routing-generator.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload routing diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: klor-task3e-routing-generator
          path: klor-trackball/design/task3/generated/
          if-no-files-found: error

      - name: Commit generated PCB
        if: steps.generate.outputs.exit_code == '0'
        shell: bash
        run: |
          if git diff --quiet -- klor-trackball/PCB/konrad_trackball/konrad_trackball.kicad_pcb; then
            echo "No generated PCB change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add klor-trackball/PCB/konrad_trackball/konrad_trackball.kicad_pcb
          git commit -m "task3e: generate PMW routing"
          git push

      - name: Enforce generator
        run: test "${{ steps.generate.outputs.exit_code }}" = "0"
