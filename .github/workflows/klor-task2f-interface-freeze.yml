name: KLOR Task 2 final interface freeze

on:
  push:
    paths:
      - "klor-trackball/design/task2/**"
      - "klor-trackball/klor1.4/PCB/klor1_4/**"
      - "klor-trackball/klor1.4/FIRMWARE/qmk_rp2040/electronlab/klor/**"
      - "klor-trackball/klorball35/**"
      - ".github/workflows/klor-task2f-interface-freeze.yml"
  pull_request:
    paths:
      - "klor-trackball/design/task2/**"
      - "klor-trackball/klor1.4/PCB/klor1_4/**"
      - "klor-trackball/klor1.4/FIRMWARE/qmk_rp2040/electronlab/klor/**"
      - "klor-trackball/klorball35/**"
      - ".github/workflows/klor-task2f-interface-freeze.yml"

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Rebuild Task 2A evidence
        run: |
          mkdir -p klor-trackball/design/task2/generated
          python3 klor-trackball/design/task2/audit_task2a_removed_key.py \
            --json-output klor-trackball/design/task2/generated/task2a-removed-key-audit.json

      - name: Rebuild Task 2B evidence
        run: |
          python3 klor-trackball/design/task2/audit_task2b_gpio_trrs.py \
            --json-output klor-trackball/design/task2/generated/task2b-gpio-trrs-audit.json

      - name: Rebuild Task 2C evidence
        run: |
          python3 klor-trackball/design/task2/audit_task2c_kivipallur_connector.py \
            --json-output klor-trackball/design/task2/generated/task2c-kivipallur-connector-audit.json

      - name: Rebuild Task 2D evidence
        run: |
          python3 klor-trackball/design/task2/audit_task2d_pcb_net_contract.py \
            --task2b-json klor-trackball/design/task2/generated/task2b-gpio-trrs-audit.json \
            --task2c-json klor-trackball/design/task2/generated/task2c-kivipallur-connector-audit.json \
            --json-output klor-trackball/design/task2/generated/task2d-pcb-net-contract-audit.json

      - name: Rebuild Task 2E evidence
        run: |
          python3 klor-trackball/design/task2/audit_task2e_firmware_ownership.py \
            --task2d-json klor-trackball/design/task2/generated/task2d-pcb-net-contract-audit.json \
            --json-output klor-trackball/design/task2/generated/task2e-firmware-ownership-audit.json

      - name: Freeze Task 2 interface
        id: freeze
        shell: bash
        run: |
          set +e
          python3 klor-trackball/design/task2/audit_task2f_interface_freeze.py \
            --task2a-json klor-trackball/design/task2/generated/task2a-removed-key-audit.json \
            --task2b-json klor-trackball/design/task2/generated/task2b-gpio-trrs-audit.json \
            --task2c-json klor-trackball/design/task2/generated/task2c-kivipallur-connector-audit.json \
            --task2d-json klor-trackball/design/task2/generated/task2d-pcb-net-contract-audit.json \
            --task2e-json klor-trackball/design/task2/generated/task2e-firmware-ownership-audit.json \
            --json-output klor-trackball/design/task2/generated/task2f-interface-freeze.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload complete Task 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: klor-task2-final-interface-freeze
          path: klor-trackball/design/task2/generated/
          if-no-files-found: error

      - name: Enforce Task 2 completion gate
        run: test "${{ steps.freeze.outputs.exit_code }}" = "0"
