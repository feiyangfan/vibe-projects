name: KLOR Task 3M - mechanical integration

on:
  pull_request:
    paths:
      - "klor-trackball/ergogen/**"
      - "klor-trackball/Keyball 25mm Trackball Case Type C - 6719828/**"
      - "klor-trackball/klor1.4/case/3DP/konrad/**"
      - ".github/workflows/klor-ergogen-task3m.yml"

permissions:
  contents: read

jobs:
  mechanical-fit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: klor-trackball/ergogen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mechanical validator dependencies
        run: >-
          python -m pip install
          "PyYAML==6.0.2"
          "numpy>=2.0,<3"
          "shapely>=2.0,<3"
          "trimesh>=4.6,<5"
          "manifold3d>=3.1,<4"
          "mapbox-earcut>=1.0,<2"
          "ezdxf>=1.3,<2"
          "networkx>=3.4,<4"

      - name: Generate Ergogen geometry
        run: npx --yes ergogen@4.2.1 . --output generated --clean --svg --debug

      - name: Re-run Task 2C cavity gate
        run: python scripts/validate_task2c.py --generated generated

      - name: Re-run Task 2D geometry freeze
        run: python scripts/validate_task2d.py --generated generated

      - name: Re-run Task 3D right PCB gate
        run: python scripts/validate_task3d.py generated

      - name: Build and validate common-frame mechanical assembly
        run: python scripts/validate_task3m.py --generated generated --output generated-mechanical

      - name: Upload Task 3M mechanical assembly
        uses: actions/upload-artifact@v4
        with:
          name: klor-task3m-mechanical-integration
          path: |
            klor-trackball/ergogen/generated-mechanical/task3m_konrad_switchplate_right.stl
            klor-trackball/ergogen/generated-mechanical/task3m_konrad_case_right.stl
            klor-trackball/ergogen/generated-mechanical/task3m_common_frame.glb
            klor-trackball/ergogen/generated-mechanical/task3m_fit_report.json
          if-no-files-found: error
